apiVersion: v1
kind: Service
metadata:
  name: admin-frontend-service
  namespace: blood-donation
  labels:
    app: admin-frontend
    component: frontend
    role: admin
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: admin-frontend
