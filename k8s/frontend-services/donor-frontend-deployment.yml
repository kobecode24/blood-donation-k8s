apiVersion: apps/v1
kind: Deployment
metadata:
  name: donor-frontend-deployment
  namespace: blood-donation
  labels:
    app: donor-frontend
    component: ui
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: donor-frontend
  template:
    metadata:
      labels:
        app: donor-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: donor-frontend
        image: nginx:1.21-alpine
        ports:
        - containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        - name: html-content
          mountPath: /usr/share/nginx/html
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: nginx-run
          mountPath: /var/run
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: nginx-config
        configMap:
          name: donor-frontend-nginx-config
      - name: html-content
        configMap:
          name: donor-frontend-html
      - name: nginx-cache
        emptyDir: {}
      - name: nginx-run
        emptyDir: {}
