apiVersion: v1
kind: ConfigMap
metadata:
  name: donor-frontend-html
  namespace: blood-donation
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>🩸 Blood Donation System - Donor Portal</title>
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body { 
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                background: linear-gradient(135deg, #dc143c, #8b0000);
                color: white;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .container {
                max-width: 800px;
                padding: 2rem;
                text-align: center;
                background: rgba(255,255,255,0.1);
                backdrop-filter: blur(10px);
                border-radius: 20px;
                box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            }
            .logo { font-size: 4rem; margin-bottom: 1rem; }
            h1 { font-size: 2.5rem; margin-bottom: 1rem; }
            .status { 
                background: rgba(34, 197, 94, 0.2);
                padding: 1rem;
                border-radius: 10px;
                margin: 2rem 0;
                border: 1px solid rgba(34, 197, 94, 0.5);
            }
            .api-test {
                display: grid;
                gap: 1rem;
                margin: 2rem 0;
            }
            .api-card {
                background: rgba(255,255,255,0.1);
                padding: 1rem;
                border-radius: 10px;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            .btn {
                background: #dc143c;
                color: white;
                border: none;
                padding: 0.5rem 1rem;
                border-radius: 5px;
                cursor: pointer;
                transition: background 0.3s;
            }
            .btn:hover { background: #8b0000; }
            .result {
                margin-top: 0.5rem;
                font-size: 0.9rem;
                opacity: 0.8;
                word-break: break-all;
            }
            .features {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                gap: 1rem;
                margin: 2rem 0;
            }
            .feature {
                background: rgba(255,255,255,0.1);
                padding: 1.5rem;
                border-radius: 10px;
                text-align: left;
            }
            .feature h3 { margin-bottom: 0.5rem; color: #ffd700; }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="logo">🩸</div>
            <h1>Blood Donation System</h1>
            <p>Donor Portal - Kubernetes Deployment</p>
            
            <div class="status">
                ✅ Frontend Successfully Deployed!<br>
                <small>Running on Kubernetes with NGINX Ingress</small>
            </div>
            
            <div class="api-test">
                <h3>🔗 API Connectivity Test</h3>
                <div class="api-card">
                    <span>👤 User Service</span>
                    <button class="btn" onclick="testAPI('user')">Test API</button>
                    <div id="user-result" class="result"></div>
                </div>
                <div class="api-card">
                    <span>🎯 Campaign Service</span>
                    <button class="btn" onclick="testAPI('campaign')">Test API</button>
                    <div id="campaign-result" class="result"></div>
                </div>
                <div class="api-card">
                    <span>📅 Appointment Service</span>
                    <button class="btn" onclick="testAPI('appointment')">Test API</button>
                    <div id="appointment-result" class="result"></div>
                </div>
                <div class="api-card">
                    <span>📊 Analytics Service</span>
                    <button class="btn" onclick="testAPI('analytics')">Test API</button>
                    <div id="analytics-result" class="result"></div>
                </div>
            </div>
            
            <div class="features">
                <div class="feature">
                    <h3>🏥 Register as Donor</h3>
                    <p>Create your profile and help save lives through blood donation</p>
                </div>
                <div class="feature">
                    <h3>📍 Find Campaigns</h3>
                    <p>Discover blood donation drives near your location</p>
                </div>
                <div class="feature">
                    <h3>📱 Book Appointments</h3>
                    <p>Schedule your donation appointments with ease</p>
                </div>
                <div class="feature">
                    <h3>📊 Track Donations</h3>
                    <p>Monitor your donation history and impact</p>
                </div>
            </div>
            
            <p><small>Kubernetes Deployment: blood-donation namespace | NGINX Ingress Controller</small></p>
        </div>
        
        <script>
            async function testAPI(service) {
                const resultDiv = document.getElementById(service + '-result');
                resultDiv.innerHTML = '🔄 Testing...';
                
                try {
                    const response = await fetch(`/api/${service}/health`);
                    const data = await response.json();
                    resultDiv.innerHTML = `✅ ${data.service} - ${data.status} (Port: ${data.port})`;
                } catch (error) {
                    resultDiv.innerHTML = `❌ Connection failed: ${error.message}`;
                }
            }
            
            // Auto-test APIs on load
            window.addEventListener('load', () => {
                setTimeout(() => {
                    ['user', 'campaign', 'appointment', 'analytics'].forEach(service => {
                        testAPI(service);
                    });
                }, 1000);
            });
        </script>
    </body>
    </html>
