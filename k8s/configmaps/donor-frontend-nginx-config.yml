apiVersion: v1
kind: ConfigMap
metadata:
  name: donor-frontend-nginx-config
  namespace: blood-donation
data:
  nginx.conf: |
    user  nginx;
    worker_processes  auto;
    error_log  /var/log/nginx/error.log warn;
    pid        /var/run/nginx.pid;
    
    events {
        worker_connections  1024;
    }
    
    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;
        
        log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"';
        
        access_log  /var/log/nginx/access.log  main;
        sendfile        on;
        keepalive_timeout  65;
        
        server {
            listen       8080;
            server_name  blood-donation.local;
            root         /usr/share/nginx/html;
            index        index.html;
            
            # Security headers
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            
            # Frontend routes (SPA support)
            location / {
                try_files $uri $uri/ /index.html;
            }
            
            # API proxy for backend services - direct to Kubernetes services
            location /api/user/ {
                proxy_pass http://user-service.blood-donation.svc.cluster.local:3001/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
            
            location /api/campaign/ {
                proxy_pass http://campaign-service.blood-donation.svc.cluster.local:3002/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
            
            location /api/appointment/ {
                proxy_pass http://appointment-service.blood-donation.svc.cluster.local:3003/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
            
            location /api/analytics/ {
                proxy_pass http://analytics-service.blood-donation.svc.cluster.local:3004/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
            
            # Health check endpoint
            location /health {
                access_log off;
                return 200 '{"status":"healthy","service":"donor-frontend"}\n';
                add_header Content-Type application/json;
            }
        }
    }
