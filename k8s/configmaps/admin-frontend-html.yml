apiVersion: v1
kind: ConfigMap
metadata:
  name: admin-frontend-html
  namespace: blood-donation
  labels:
    app: admin-frontend
    component: frontend
    role: admin
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>🏥 Blood Donation Admin Dashboard</title>
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                background: linear-gradient(135deg, #1e3a8a, #1e40af, #3b82f6);
                color: white;
                min-height: 100vh;
            }
            .header {
                background: rgba(0, 0, 0, 0.2);
                padding: 1rem 2rem;
                backdrop-filter: blur(10px);
                display: flex;
                justify-content: space-between;
                align-items: center;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            }
            .logo { 
                display: flex; 
                align-items: center; 
                gap: 1rem; 
                font-size: 1.5rem; 
                font-weight: bold; 
            }
            .dashboard {
                padding: 2rem;
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
                gap: 2rem;
                max-width: 1400px;
                margin: 0 auto;
            }
            .card {
                background: rgba(255, 255, 255, 0.1);
                backdrop-filter: blur(10px);
                border-radius: 15px;
                padding: 1.5rem;
                border: 1px solid rgba(255, 255, 255, 0.2);
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            }
            .card h3 {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                margin-bottom: 1rem;
                color: #fbbf24;
            }
            .status-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                gap: 1rem;
                margin-bottom: 2rem;
            }
            .status-card {
                background: rgba(255, 255, 255, 0.1);
                padding: 1rem;
                border-radius: 10px;
                text-align: center;
                border: 1px solid rgba(255, 255, 255, 0.2);
            }
            .status-card .number {
                font-size: 2rem;
                font-weight: bold;
                color: #34d399;
                display: block;
            }
            .status-card .label {
                font-size: 0.9rem;
                opacity: 0.8;
                margin-top: 0.5rem;
            }
            .api-test {
                display: grid;
                gap: 1rem;
            }
            .api-card {
                background: rgba(255, 255, 255, 0.1);
                padding: 1rem;
                border-radius: 10px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                border: 1px solid rgba(255, 255, 255, 0.2);
            }
            .btn {
                background: #1e40af;
                color: white;
                border: none;
                padding: 0.5rem 1rem;
                border-radius: 5px;
                cursor: pointer;
                transition: all 0.3s;
                font-weight: 500;
            }
            .btn:hover { 
                background: #1e3a8a; 
                transform: translateY(-2px);
            }
            .btn.danger {
                background: #dc2626;
            }
            .btn.danger:hover {
                background: #b91c1c;
            }
            .result {
                margin-top: 0.5rem;
                font-size: 0.9rem;
                opacity: 0.9;
                word-break: break-all;
            }
            .actions {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                gap: 1rem;
                margin-top: 1rem;
            }
            .action-btn {
                background: rgba(255, 255, 255, 0.1);
                border: 1px solid rgba(255, 255, 255, 0.2);
                color: white;
                padding: 1rem;
                border-radius: 10px;
                cursor: pointer;
                transition: all 0.3s;
                text-align: center;
                text-decoration: none;
                display: block;
            }
            .action-btn:hover {
                background: rgba(255, 255, 255, 0.2);
                transform: translateY(-2px);
            }
            .logs {
                background: rgba(0, 0, 0, 0.3);
                padding: 1rem;
                border-radius: 10px;
                font-family: 'Courier New', monospace;
                font-size: 0.8rem;
                height: 200px;
                overflow-y: auto;
                margin-top: 1rem;
            }
            .navbar {
                display: flex;
                gap: 1rem;
            }
            .nav-btn {
                background: rgba(255, 255, 255, 0.1);
                color: white;
                border: none;
                padding: 0.5rem 1rem;
                border-radius: 5px;
                cursor: pointer;
                transition: all 0.3s;
            }
            .nav-btn:hover, .nav-btn.active {
                background: rgba(255, 255, 255, 0.2);
            }
        </style>
    </head>
    <body>
        <div class="header">
            <div class="logo">
                <span>🏥</span>
                <span>Blood Donation Admin Dashboard</span>
            </div>
            <div class="navbar">
                <button class="nav-btn active" onclick="showSection('overview')">Overview</button>
                <button class="nav-btn" onclick="showSection('campaigns')">Campaigns</button>
                <button class="nav-btn" onclick="showSection('users')">Users</button>
                <button class="nav-btn" onclick="showSection('analytics')">Analytics</button>
            </div>
        </div>

        <div class="dashboard">
            <!-- System Status Overview -->
            <div class="status-grid">
                <div class="status-card">
                    <span class="number" id="total-users">1,247</span>
                    <div class="label">Registered Donors</div>
                </div>
                <div class="status-card">
                    <span class="number" id="active-campaigns">8</span>
                    <div class="label">Active Campaigns</div>
                </div>
                <div class="status-card">
                    <span class="number" id="total-appointments">156</span>
                    <div class="label">Scheduled Appointments</div>
                </div>
                <div class="status-card">
                    <span class="number" id="blood-units">342</span>
                    <div class="label">Units Collected</div>
                </div>
            </div>

            <!-- System Health Monitoring -->
            <div class="card">
                <h3>🔍 System Health Monitoring</h3>
                <div class="api-test">
                    <div class="api-card">
                        <span>👤 User Service</span>
                        <button class="btn" onclick="testAPI('user')">Check Health</button>
                        <div id="user-result" class="result"></div>
                    </div>
                    <div class="api-card">
                        <span>🎯 Campaign Service</span>
                        <button class="btn" onclick="testAPI('campaign')">Check Health</button>
                        <div id="campaign-result" class="result"></div>
                    </div>
                    <div class="api-card">
                        <span>📅 Appointment Service</span>
                        <button class="btn" onclick="testAPI('appointment')">Check Health</button>
                        <div id="appointment-result" class="result"></div>
                    </div>
                    <div class="api-card">
                        <span>📊 Analytics Service</span>
                        <button class="btn" onclick="testAPI('analytics')">Check Health</button>
                        <div id="analytics-result" class="result"></div>
                    </div>
                </div>
            </div>

            <!-- Campaign Management -->
            <div class="card">
                <h3>🎯 Campaign Management</h3>
                <div class="actions">
                    <button class="action-btn" onclick="showCampaigns()">📋 View All Campaigns</button>
                    <button class="action-btn" onclick="createCampaign()">➕ Create New Campaign</button>
                    <button class="action-btn" onclick="manageCampaigns()">⚙️ Manage Active Campaigns</button>
                    <button class="action-btn" onclick="campaignAnalytics()">📈 Campaign Analytics</button>
                </div>
            </div>

            <!-- User Management -->
            <div class="card">
                <h3>👥 User Management</h3>
                <div class="actions">
                    <button class="action-btn" onclick="viewUsers()">👀 View All Users</button>
                    <button class="action-btn" onclick="userAnalytics()">📊 User Statistics</button>
                    <button class="action-btn" onclick="managePermissions()">🔐 Manage Permissions</button>
                    <button class="action-btn" onclick="exportUsers()">📤 Export User Data</button>
                </div>
            </div>

            <!-- Analytics Dashboard -->
            <div class="card">
                <h3>📈 Analytics Dashboard</h3>
                <div class="actions">
                    <button class="action-btn" onclick="donationTrends()">📊 Donation Trends</button>
                    <button class="action-btn" onclick="performanceMetrics()">⚡ Performance Metrics</button>
                    <button class="action-btn" onclick="geographicAnalysis()">🗺️ Geographic Analysis</button>
                    <button class="action-btn" onclick="generateReports()">📋 Generate Reports</button>
                </div>
            </div>

            <!-- System Administration -->
            <div class="card">
                <h3>⚙️ System Administration</h3>
                <div class="actions">
                    <button class="action-btn" onclick="backupSystem()">💾 Backup System</button>
                    <button class="action-btn" onclick="systemLogs()">📝 View System Logs</button>
                    <button class="action-btn" onclick="securityAudit()">🔒 Security Audit</button>
                    <button class="action-btn" onclick="maintenanceMode()">🛠️ Maintenance Mode</button>
                </div>
            </div>

            <!-- System Logs -->
            <div class="card">
                <h3>📝 Recent System Logs</h3>
                <div class="logs" id="system-logs">
                    <div>[2025-11-13 02:56:01] INFO: Admin dashboard started successfully</div>
                    <div>[2025-11-13 02:55:43] INFO: All backend services healthy</div>
                    <div>[2025-11-13 02:55:32] INFO: New donor registered: ID #1247</div>
                    <div>[2025-11-13 02:55:21] INFO: Campaign "Winter Blood Drive" created</div>
                    <div>[2025-11-13 02:55:15] INFO: Database backup completed successfully</div>
                    <div>[2025-11-13 02:55:08] INFO: System health check passed</div>
                </div>
            </div>
        </div>

        <script>
            // API Health Testing
            async function testAPI(service) {
                const resultDiv = document.getElementById(service + '-result');
                resultDiv.innerHTML = '🔄 Testing...';
                
                try {
                    const response = await fetch(`/api/${service}/health`);
                    const data = await response.json();
                    resultDiv.innerHTML = `✅ ${data.service} - ${data.status} (Port: ${data.port})`;
                } catch (error) {
                    resultDiv.innerHTML = `❌ Connection failed: ${error.message}`;
                }
            }

            // Auto-test APIs on load
            window.addEventListener('load', () => {
                setTimeout(() => {
                    ['user', 'campaign', 'appointment', 'analytics'].forEach(service => {
                        testAPI(service);
                    });
                }, 1000);
            });

            // Navigation Functions
            function showSection(section) {
                // Update active nav button
                document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
                event.target.classList.add('active');
                
                // Show section content (placeholder)
                console.log(`Showing ${section} section`);
            }

            // Management Functions
            function showCampaigns() {
                alert('Campaign Management: View and manage all blood donation campaigns');
            }

            function createCampaign() {
                alert('Create New Campaign: Launch a new blood donation drive');
            }

            function manageCampaigns() {
                alert('Manage Campaigns: Edit active campaign settings and locations');
            }

            function campaignAnalytics() {
                alert('Campaign Analytics: View performance metrics for all campaigns');
            }

            function viewUsers() {
                alert('User Management: View all registered donors and administrators');
            }

            function userAnalytics() {
                alert('User Analytics: Analyze donor demographics and activity');
            }

            function managePermissions() {
                alert('Permission Management: Configure user roles and access levels');
            }

            function exportUsers() {
                alert('Export Data: Generate user reports for compliance and analysis');
            }

            function donationTrends() {
                alert('Donation Trends: Analyze blood donation patterns over time');
            }

            function performanceMetrics() {
                alert('Performance Metrics: System performance and API response times');
            }

            function geographicAnalysis() {
                alert('Geographic Analysis: View donation patterns by location');
            }

            function generateReports() {
                alert('Generate Reports: Create comprehensive analytics reports');
            }

            function backupSystem() {
                alert('System Backup: Create full system backup for disaster recovery');
            }

            function systemLogs() {
                alert('System Logs: View detailed application and system logs');
            }

            function securityAudit() {
                alert('Security Audit: Run comprehensive security assessment');
            }

            function maintenanceMode() {
                alert('Maintenance Mode: Put system in maintenance mode for updates');
            }

            // Real-time log updates (simulation)
            function addLogEntry(message) {
                const logs = document.getElementById('system-logs');
                const timestamp = new Date().toISOString().replace('T', ' ').substr(0, 19);
                const entry = document.createElement('div');
                entry.innerHTML = `[${timestamp}] INFO: ${message}`;
                logs.insertBefore(entry, logs.firstChild);
                
                // Keep only last 10 entries
                while (logs.children.length > 10) {
                    logs.removeChild(logs.lastChild);
                }
            }

            // Simulate real-time updates
            setInterval(() => {
                const messages = [
                    'Health check completed for all services',
                    'New appointment scheduled',
                    'Campaign metrics updated',
                    'User authentication successful',
                    'Database optimization completed',
                    'Security scan passed'
                ];
                const randomMessage = messages[Math.floor(Math.random() * messages.length)];
                addLogEntry(randomMessage);
            }, 30000); // Every 30 seconds
        </script>
    </body>
    </html>
